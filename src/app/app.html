<div class="paper-grain" aria-hidden="true"></div>


<app-particles />

<app-roots />

<div class="flex flex-col md:flex-row max-w-[1280px] mx-auto px-4 sm:px-6 pt-6 sm:pt-8 pb-20 gap-6 md:gap-8">
  <div id="app" class="flex-1 min-w-0">
    @switch (state.view()) {
      @case ('home') {
        <app-home />
      }
      @case ('list') {
        <app-list />
      }
      @case ('chat') {
        <app-chat />
      }
    }
  </div>

  <div id="chatbot-backdrop" (click)="state.toggleChatbotDrawer(false)"
    class="fixed inset-0 bg-scrim/40 dark:bg-black/60 z-40 md:hidden"
    [class.opacity-0]="!state.drawerOpen()" [class.pointer-events-none]="!state.drawerOpen()"></div>

  <aside id="chatbot-sidebar" class="fixed md:static inset-y-0 right-0 z-50 shrink-0
                  w-[86vw] max-w-sm md:max-w-none md:w-[300px]
                  md:translate-x-0"
    [class.translate-x-full]="!state.drawerOpen()">
    <app-chatbot />
  </aside>

  <div class="fixed bottom-5 right-5 z-30 flex gap-2">
    <button (click)="state.toggleTheme()"
      class="w-14 h-14 rounded-full bg-surface text-ink border border-line shadow-lg shadow-ink/20 dark:shadow-black/40 flex items-center justify-center active:scale-95 transition-transform"
      [attr.aria-label]="state.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
      @if (state.theme() === 'dark') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" class="w-6 h-6">
          <circle cx="12" cy="12" r="5" />
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" class="w-6 h-6">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>
    <button id="chatbot-toggle-btn" (click)="state.toggleChatbotDrawer(true)"
      class="md:hidden w-14 h-14 rounded-full bg-jade text-bg shadow-lg shadow-ink/20 dark:shadow-black/40 flex items-center justify-center active:scale-95 transition-transform"
      aria-label="Abrir asistente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" class="w-6 h-6">
        <path
          d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
      </svg>
    </button>
  </div>
</div>
