<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lazo</title>
  <meta name="description"
    content="Practica cómo manejar conflictos escolares conversando con un personaje y recibiendo retroalimentación desde diálogo, mediación y escucha activa." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "#F5F1E4",
            surface: "#FFFFFF",
            ink: "#21302A",
            "ink-soft": "#55655C",
            line: "#DCD3B9",

            jade: "#2F6E5B", "jade-soft": "#E3EEE8",
            gold: "#A8763A", "gold-soft": "#F1E6CE",
            slate: "#48626B", "slate-soft": "#E4EBEC",
            moss: "#6B7A3E", "moss-soft": "#E9EDDD",
            teal: "#2E7E82", "teal-soft": "#DFEDEE",
            indigo: "#4A5A8A", "indigo-soft": "#E4E7F1",
            plum: "#6B4A6B", "plum-soft": "#EFE3EF",
            clay: "#8A5A3E", "clay-soft": "#F0E3D6",
            berry: "#8A3E5A", "berry-soft": "#F1DEE7",
            olive: "#7A7A3E", "olive-soft": "#EFEFDA",
            alert: "#A8472A", "alert-soft": "#F5E1D6"
          },
          fontFamily: {
            display: ["Fraunces", "Georgia", "serif"],
            body: ["Inter", "-apple-system", "Segoe UI", "sans-serif"]
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="bg-bg text-ink font-body leading-[1.55] antialiased min-h-screen">
  <div class="paper-grain" aria-hidden="true"></div>
  <div id="bg-blobs" class="fixed inset-0 -z-10 overflow-hidden pointer-events-none" aria-hidden="true">
    <div data-depth="18" class="absolute -top-28 -left-20 w-80 h-80 sm:w-96 sm:h-96 bg-jade/10 rounded-full blur-3xl">
    </div>
    <div data-depth="28"
      class="absolute top-1/3 -right-24 w-72 h-72 sm:w-[26rem] sm:h-[26rem] bg-gold/10 rounded-full blur-3xl"></div>
    <div data-depth="14" class="absolute bottom-0 left-1/4 w-72 h-72 bg-teal/10 rounded-full blur-3xl"></div>
    <div data-depth="24"
      class="absolute top-[62%] right-[8%] w-52 h-52 sm:w-64 sm:h-64 bg-plum/[0.07] rounded-full blur-3xl"></div>
    <div data-depth="10"
      class="absolute -bottom-16 right-1/3 w-40 h-40 sm:w-56 sm:h-56 bg-olive/[0.08] rounded-full blur-2xl"></div>
    <div data-depth="32" class="absolute top-[8%] left-[42%] w-24 h-24 bg-clay/[0.06] rounded-full blur-2xl"></div>
  </div>

  <canvas id="bg-particles" class="fixed inset-0 -z-10 pointer-events-none" aria-hidden="true"></canvas>

  <div data-depth="6" class="hidden xl:block fixed left-0 top-0 h-screen w-40 -z-10 pointer-events-none overflow-hidden"
    aria-hidden="true">
    <svg id="roots-left" viewBox="0 0 140 900" preserveAspectRatio="xMidYMin slice" class="w-full h-full"></svg>
  </div>
  <div data-depth="6"
    class="hidden xl:block fixed right-0 top-0 h-screen w-40 -z-10 pointer-events-none overflow-hidden"
    aria-hidden="true">
    <svg id="roots-right" viewBox="0 0 140 900" preserveAspectRatio="xMidYMin slice" class="w-full h-full"></svg>
  </div>

  <div class="flex flex-col md:flex-row max-w-[1280px] mx-auto px-4 sm:px-6 pt-6 sm:pt-8 pb-20 gap-6 md:gap-8">
    <div id="app" class="flex-1 min-w-0"></div>

    <div id="chatbot-backdrop" onclick="window.toggleChatbotDrawer(false)"
      class="fixed inset-0 bg-ink/40 z-40 opacity-0 pointer-events-none md:hidden"></div>

    <aside id="chatbot-sidebar" class="fixed md:static inset-y-0 right-0 z-50 shrink-0
                  w-[86vw] max-w-sm md:max-w-none md:w-[300px]
                  translate-x-full md:translate-x-0">
    </aside>

    <button id="chatbot-toggle-btn" onclick="window.toggleChatbotDrawer(true)"
      class="md:hidden fixed bottom-5 right-5 z-30 w-14 h-14 rounded-full bg-jade text-bg shadow-lg shadow-ink/20 flex items-center justify-center active:scale-95 transition-transform"
      aria-label="Abrir asistente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" class="w-6 h-6">
        <path
          d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
      </svg>
    </button>
  </div>

  <div id="modal-overlay"
    class="fixed inset-0 bg-[rgba(33,48,42,0.45)] backdrop-blur-[2px] items-center justify-center p-4 z-[60] hidden">
    <div id="modal-panel"
      class="bg-surface max-w-[460px] w-full p-6 rounded-2xl shadow-xl relative max-h-[80vh] overflow-y-auto">
    </div>
  </div>

  <script>
    window.toggleChatbotDrawer = function (open) {
      const drawer = document.getElementById('chatbot-sidebar');
      const backdrop = document.getElementById('chatbot-backdrop');
      if (!drawer || !backdrop) return;
      if (open) {
        drawer.classList.remove('translate-x-full');
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        drawer.classList.add('translate-x-full');
        backdrop.classList.add('opacity-0', 'pointer-events-none');
      }
    };
  </script>

  <script src="js/particles.js"></script>
  <script src="js/roots.js"></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
